description:
  swe: ''
  eng: |-
    <h2>Models</h2>

    <p><a href="https://github.com/flairNLP/flair">Flair</a> is a powerful NLP library. We provide two Flair models for Swedish part-of-speech tagging.</p>
    <p><b><code>flair_eval</code></b> is trained on <a href="https://sprakbanken.se/en/resources/suc3">SUC3</a> with <a href="https://sprakbanken.se/en/resources/talbanken">Talbanken_SBX_dev</a> as dev set. The advantage of this model is that it can be evaluated, using Talbanken_SBX_test or <a href="https://sprakbanken.se/en/resources/sic2">SIC2</a>. The evaluation results are reported in the table below.</p>

    <table style="width:25">
      <tr>
        <th>Test set</th>
        <th>Exact match</th>
        <th>POS</th>
        <th>MSD</th>
      </tr>
      <tr>
        <td>Talbanken_SBX_test</td>
        <td>0.978</td>
        <td>0.987</td>
        <td>0.990</td>
      </tr>
      <tr>
        <td>SIC2</td>
        <td>0.926</td>
        <td>0.940</td>
        <td>0.964</td>
      </tr>
    </table>

    <h3>
      Evaluating POS-tagging
    </h3>
    <p>
        This is a brief description of how the evaluation of POS-tagging was done (relevant for our <a href="https://sprakbanken.se/en/resources/model">model</a>&nbsp;descriptions).
    </p>
    <p>
        There are three measures: <strong>exact match</strong> (both POS and MSD are correct), <strong>POS</strong> (POS is correct, MSD does not matter), MSD. The latter measure is slightly more complicated: it's the Jaccard similarity index, i.e. the number of correctly identified category values divided by the total number of different categories in both gold and test tags (=the length of the union of the gold and test category sets). The metric does not depend on whether POS is correctly identified. Here are some examples:&nbsp;
    </p>
    <p>
        • (NN)NEU.-.-.SMS vs. (NN)UTR.-.-.SMS = 0.75 (four categories, three correct)
    </p>
    <p>
        &nbsp;• (VB)PRS.SFO vs. (VB)INF.SFO = 0.33 (three categories: verb form (INF), tense (PRS), voice (SFO); one correct)&nbsp;
    </p>
    <p>
        • (JJ)POS.UTR.SIN.IND.NOM vs. (PC)PRF.UTR.SIN.IND.NOM = 0.67 (six categories, four correct)&nbsp;
    </p>
    <p>
        • (JJ)POS.UTR+NEU.PLU.IND+DEF.NOM vs. (NN)UTR.SIN.IND.NOM = 0.2 (five categories, one correct)
    </p>
    <p>
      Read more about the evaluation in <a href="https://gup.ub.gu.se/publication/304973?lang=sv">Part-of-speech tagging of Swedish texts in the neural era.</a>
    </p>

    <p><b><code>flair_full</code></b> is trained on SUC3 + Talbanken_SBX_test + SIC2 with Talbanken_SBX_dev as dev set. We cannot evaluate the performance of this model, but we expect it to perform better than <code>flair_eval</code>, or at least not worse.</p>

    <h3>Using the models on your own</h3>
    <p>Download the model and follow the instructions from <a href="https://github.com/flairNLP/flair">Flair</a>. By default, Flair's own embeddings will be used (our experiments show that they provide the best results), but you may use <a href="https://sprakbanken.se/resurser/embeddings">other embeddings</a> instead (or combine them). GPU is strongly recommended.<p>
