short_description: 
  swe: Polisrapporter från Göteborgs poliskammares detektiva avdelning 1868–1902
  eng: Police reports from the Detective Division of the Gothenburg Police 1868–1902
description:
  swe: |-
    <p>Projektet <i>Detektiva avdelningen</i> baseras på
    texter från Göteborgspolisen, från slutet av 1800-talet till början av
    1900-talet. Texterna har transkriberats manuellt. Originaldatan finns hos <a
    href="https://riksarkivet.se/psidata/goteborgs-poliskammare" target="_blank">Riksarkivet</a>.</p>
    <p>En del av vårt projekt är att markera på en karta de platser som
    omnämns i texterna. Den adressdatan finns tillgänglig här, i två filer.
    <a
    href="https://svn.spraakbanken.gu.se/sb-arkiv/pub/detektiva/geocoords.txt"
    target="_blank">geocoords.txt</a> innehåller geografiska koordinater, <a
    href="https://svn.spraakbanken.gu.se/sb-arkiv/pub/detektiva/pixelcoords.txt"
    target="_blank">pixelcoords.txt</a> innehåller koordinater i den <a
    href="https://upload.wikimedia.org/wikipedia/commons/8/8c/Simon%27s_1888_Gothenburg_map.jpg" target="_blank">kart-fil</a>
    vi har använt.</p>
  eng: |-
    <p>The <i>Detective Department</i> project is based on texts from the
    Gothenburg police, from the late 1800s to the early 1900s. These texts
    have been transcribed manually. The original data can be found at <a
    href="https://riksarkivet.se/psidata/goteborgs-poliskammare"
    target="_blank">Riksarkivet</a>.</p>
    <p>One part of our project consists of finding on a map the places
    mentioned in the texts. This address data is available here, in two
    files. <a
    href="https://svn.spraakbanken.gu.se/sb-arkiv/pub/detektiva/geocoords.txt"
    target="_blank">geocoords.txt</a> contains geographical coordinates, <a
    href="https://svn.spraakbanken.gu.se/sb-arkiv/pub/detektiva/pixelcoords.txt"
    target="_blank">pixelcoords.txt</a> contains coordinates in the <a
    href="https://upload.wikimedia.org/wikipedia/commons/8/8c/Simon%27s_1888_Gothenburg_map.jpg"
    target="_blank">map file</a> we have used.</p>
