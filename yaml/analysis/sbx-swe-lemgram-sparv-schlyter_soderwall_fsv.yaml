created: 2012-10-23
updated: 2021-06-01
language_varieties:
  - fsv
name:
  swe: Annotering av lemgram för fornsvenska
  eng: Annotation of lemgrams for Old Swedish
short_description:
  swe: Uppslagning av lemgram med Schlyter och Söderwall
  eng: Lookup of lemgrams using Schlyter and Soderwall
task: lexical lookup
keywords:
  - schlyter
  - soderwall
annotations:
  - <token>:hist.lemgram
models:
  - name: Old Swedish morphology
    url: https://spraakbanken.gu.se/resurser/fsvm
other_references:
  - '{publication 72502}'
  - '{publication 198794}'
  - '{publication 144291}'
description:
  swe: |-
    Uppslagning av lemgram för fornsvenska med Schlyter och Söderwall. Kandidater hämtas från det fornsvenska
    morfologiska lexikonet och beräknas över ordform samt möjliga stavningsvarianter.
  eng: |-
    Lookup of lemgrams for Old Swedish using Schlyter and Soderwall. Candidates are retrieved from the Old Swedish
    morphology lexicon and computed over token forms and possible spelling variants.
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:hist.lemgram  # Fallback lemgrams from Dalin or Swedberg
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: swe
    variety: fsv
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token lemgram="|fsvm--svaka..vb.1|fsvm--svarlika..ab.1|fsvm--sværia..vb.1|">Swerikis</token>
  <token lemgram="|fsvm--rike..nn.1|fsvm--riki..nn.1|">Rike</token>
  <token lemgram="|fsvm--ar..nn.1|fsvm--ar..nn.2|fsvm--ar..nn.3|fsvm--æ..ab.1|">ær</token>
  <token lemgram="|fsvm--af..kn.2|fsvm--af..pp.1|">af</token>
  <token lemgram="|fsvm--hedhne..nn.1|fsvm--hesa..e.1|fsvm--hesa..nn.1|fsvm--hesna..vb.1|fsvm--heþna..nn.1|">hedne</token>
  <token lemgram="|fsvm--værld..nn.1|fsvm--vald..nn.1|fsvm--værald..nn.1|">værld</token>
  <token lemgram="|fsvm--saman..ab.1|fsvm--sami..pn.1|fsvm--soma..nn.1|fsvm--some..nn.1|">saman</token>
  <token lemgram="|fsvm--ko..e.1|fsvm--ko..nn.1|fsvm--komin..nn.1|fsvm--min..e.1|fsvm--min..e.2|fsvm--min..e.3|fsvm--min..pn.1|fsvm--min..pn.2|fsvm--mit..ab.1|fsvm--mit..nn.1|">komith</token>
  <token lemgram="|">,</token>
  <token lemgram="|fsvm--af..kn.2|fsvm--af..pp.1|">af</token>
  <token lemgram="|fsvm--svear..nn.1|fsvm--svet..nn.1|fsvm--sveta..vb.1|fsvm--svete..nn.1|">swea</token>
  <token lemgram="|fsvm--akh..in.1|fsvm--ok..kn.2|fsvm--ok..nn.1|fsvm--uk..nn.1|">och</token>
  <token lemgram="|fsvm--godha..vb.1|fsvm--got..nn.1|">gotha</token>
  <token lemgram="|fsvm--ladh..nn.1|fsvm--ladh..nn.2|fsvm--land..nn.1|fsvm--land..nn.2|fsvm--lidh..nn.1|fsvm--lidh..nn.2|fsvm--lidh..nn.3|fsvm--lidh..nn.4|">landh</token>
