example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - stanford.token  # Token segments
  ```

  In order to use this annotation you need to add the following settings to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: eng

  classes:
    token: stanza.token
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token>Language</token>
  <token>is</token>
  <token>the</token>
  <token>human</token>
  <token>ability</token>
  <token>to</token>
  <token>acquire</token>
  <token>and</token>
  <token>use</token>
  <token>complex</token>
  <token>systems</token>
  <token>of</token>
  <token>communication</token>
  <token>.</token>
  ```
