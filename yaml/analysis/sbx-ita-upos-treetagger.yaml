models:
  - name: italian.par.gz
    url: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/italian.par.gz
name:
  swe: UD-Ordklasstaggning med TreeTagger för italienska
  eng: UD part-of-speech tagging with TreeTagger for Italian
short_description:
  swe: Annotering av UD-ordklasser (universal dependencies) för italienska som översätts
    från TreeTagger-ordklasser
  eng: Part-of-speech annotation with UD (universal dependency) tags for Italian translated
    from TreeTagger part-of-speech tags
task: part-of-speech tagging
tagset: '[UD](https://universaldependencies.org/u/pos/)'
annotations:
  - <token>:treetagger.upos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.upos  # Part-of-speeches in UD
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: ita
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token upos="DET">Il</token>
  <token upos="NOUN">linguaggio</token>
  <token upos="ADJ">umano</token>
  <token upos="VERB">è</token>
  <token upos="DET">la</token>
  <token upos="NOUN">capacità</token>
  <token upos="NOUN">dell</token>
  <token upos="PUNCT">'</token>
  <token upos="NOUN">Uomo</token>
  <token upos="ADP">di</token>
  <token upos="VERB">comunicare</token>
  <token upos="ADP">per</token>
  <token upos="NOUN">mezzo</token>
  <token upos="ADP">di</token>
  <token upos="DET">un</token>
  <token upos="NOUN">codice</token>
  <token upos="ADJ">complesso</token>
  <token upos="PUNCT">,</token>
  <token upos="ADV">cioè</token>
  <token upos="DET">una</token>
  <token upos="NOUN">lingua</token>
  <token upos="X">.</token>
  ```
