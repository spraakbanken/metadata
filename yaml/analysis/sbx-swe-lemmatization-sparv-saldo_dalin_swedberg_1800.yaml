description:
  swe: |-
    Uppslagning av grundformer för 1800-talssvenska med SALDO, Dalin och Swedberg. Kandidat-grundformer rangordnas med
    MSD-kompatibilitet (när tillgängligt), källmärks för historiska lexikon, och en Dalin/Swedberg-fallback fyller i de
    token som inte fått någon grundform.
  eng: |-
    Lookup of base forms for 19th-century Swedish using SALDO, Dalin, and Swedberg. Candidate base forms are ranked by
    MSD compatibility (when available), source-marked for historical lexicons, and a Dalin/Swedberg fallback fills
    tokens left without a base form.
