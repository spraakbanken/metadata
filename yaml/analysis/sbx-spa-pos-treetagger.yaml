annotations:
  - <token>:treetagger.pos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.pos  # Part-of-speeches from TreeTagger
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: spa
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token pos="ART">Un</token>
  <token pos="NC">lenguaje</token>
  <token pos="VSfin">es</token>
  <token pos="ART">un</token>
  <token pos="NC">sistema</token>
  <token pos="PREP">de</token>
  <token pos="NC">comunicación</token>
  <token pos="VLadj">estructurado</token>
  <token pos="PREP">para</token>
  <token pos="ART">el</token>
  <token pos="CQUE">que</token>
  <token pos="VLfin">existe</token>
  <token pos="ART">un</token>
  <token pos="NC">contexto</token>
  <token pos="PREP">de</token>
  <token pos="NC">uso</token>
  <token pos="CC">y</token>
  <token pos="QU">ciertos</token>
  <token pos="NC">principios</token>
  <token pos="ADJ">combinatorios</token>
  <token pos="ADJ">formales</token>
  <token pos="FS">.</token>
  ```
