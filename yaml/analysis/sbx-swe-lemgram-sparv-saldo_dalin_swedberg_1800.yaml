description:
  swe: |-
    Uppslagning av SALDO-lemgram för 1800-talssvenska med hjälp av Dalin och Swedberg. Kandidat-lemgram rangordnas
    med MSD-kompatibilitet (när tillgängligt), källmärks för historiska lexikon, och en Dalin/Swedberg-fallback fyller
    i de token som inte fått något lemgram.
  eng: |-
    Lookup of lemgrams for 19th-century Swedish using SALDO, Dalin, and Swedberg. Candidate lemgrams are ranked with MSD
    compatibility (when available), source-marked for historical lexicons, and a Dalin/Swedberg fallback fills tokens
    left without lemgrams.
