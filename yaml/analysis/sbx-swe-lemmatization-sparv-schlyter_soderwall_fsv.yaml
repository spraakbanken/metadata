language_codes:
  - swe
created: 2012-10-23
updated: 2021-06-01
language_varieties:
  - fsv
name:
  swe: Annotering av grundformer för fornsvenska
  eng: Annotation of citation forms (base forms, lemmas) for Old Swedish
short_description:
  swe: Fullformsuppslagning som ger grundformer med Schlyter och Söderwall
  eng: Full-form lookup of citation forms (lemmas) using Schlyter and Soderwall
task: lemmatization
keywords:
  - schlyter
  - soderwall
annotations:
  - <token>:hist.baseform
models:
  - name: Old Swedish morphology
  - url: https://spraakbanken.gu.se/resurser/fsvm
other_references:
  - '{publication 72502}'
  - '{publication 198794}'
  - '{publication 144291}'
description:
  swe: |-
    Uppslagning av grundformer för fornsvenska med Schlyter och Söderwall. Eftersom MSD inte används i denna analys
    rangordnas kandidater med generell precision, och resultatet bygger på ordform samt eventuella stavningsvarianter.
  eng: |-
    Lookup of base forms for Old Swedish using Schlyter and Soderwall. Since MSD is not used in this analysis,
    candidates are ranked with general precision, and results are based on the token form plus optional spelling
    variants.
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:hist.baseform  # Fallback baseforms from Dalin or Swedberg
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: swe
    variety: fsv
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token baseform="|svaka|svarlika|sværia|">Swerikis</token>
  <token baseform="|rike|riki|">Rike</token>
  <token baseform="|ar|æ|">ær</token>
  <token baseform="|af|">af</token>
  <token baseform="|hedhne|hesa|hesna|heþna|">hedne</token>
  <token baseform="|værld|vald|værald|">værld</token>
  <token baseform="|saman|sami|soma|somi|">saman</token>
  <token baseform="|ko|komin|min|mit|">komith</token>
  <token baseform="|">,</token>
  <token baseform="|af|">af</token>
  <token baseform="|svear|svet|sveta|sveti|">swea</token>
  <token baseform="|akh|ok|uk|">och</token>
  <token baseform="|godha|got|">gotha</token>
  <token baseform="|ladh|land|lidh|">landh</token>
  <token baseform="|">.</token>
  ```
