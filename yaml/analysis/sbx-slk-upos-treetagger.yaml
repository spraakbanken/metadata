other_references:
  - 'Helmut Schmid (1994): [Probabilistic Part-of-Speech Tagging Using Decision Trees](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/tree-tagger1.pdf).
    Proceedings of International Conference on New Methods in Language Processing,
    Manchester, UK.'
created: 2014-09-16
updated: 2021-03-24
language_codes:
  - slk
models:
  - name: slovak.par.gz
    url: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/slovak.par.gz
trained_on: '[Slovak National Corpus](https://korpus.juls.savba.sk/index_en.html)'
name:
  swe: UD-Ordklasstaggning med TreeTagger för slovakiska
  eng: UD part-of-speech tagging with TreeTagger for Slovak
short_description:
  swe: Annotering av UD-ordklasser (universal dependencies) för slovakiska som översätts
    från TreeTagger-ordklasser
  eng: Part-of-speech annotation with UD (universal dependency) tags for Slovak translated
    from TreeTagger's part-of-speech tags
task: part-of-speech tagging
tagset: '[UD](https://universaldependencies.org/u/pos/)'
annotations:
  - <token>:treetagger.upos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.upos  # Part-of-speeches in UD
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: slk
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token upos="PRON">Jeho</token>
  <token upos="ADJ">praktickou</token>
  <token upos="NOUN">realizáciou</token>
  <token upos="VERB">je</token>
  <token upos="NOUN">reč</token>
  <token upos="PUNCT">.</token>
  ```
