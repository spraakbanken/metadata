standard_reference: 'Maria Irena Szawerna, David Alfter, Elena Volodina (2025): Annotating
  Personal Information in Swedish Texts with SPARV, in Proceedings of the First Workshop
  on Natural Language Processing and Language Models for Digital Humanities, pages
  155-163. https://aclanthology.org/2025.lm4dh-1.15/'
description:
  eng: 'A plugin for Sparv for classifying language learner texts into CEFR levels.
    The plugin accepts the following languages at the moment: Swedish, Estonian, German,
    and Portugese. Note that this plugin does not guarantee full accuracy of predictions
    and the predictions should be taken as illustrative rather than as autorithative.'
short_description:
  eng: A plugin for Sparv for classifying language learner texts.
type: analysis
task: CEFR level classification
analysis_unit: text
language_codes:
  - swe
  - est
  - deu
  - por
models:
  - url: https://hf.co/collections/rimusa/cefr-classification-models
license: MIT
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <text>:sbx_cefr_classification.cefr_level
  ```

  You also need to install the following plugin: *[sbx_cefr_classification](https://github.com/spraakbanken/sparv-sbx-cefr-classification/)*.

  For general information on how to install plugins, see [here](https://spraakbanken.gu.se/sparv/user-manual/installation-and-setup/#installing-and-uninstalling-plugins).

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).
