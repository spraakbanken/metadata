updated: 2021-03-24
language_codes:
  - ron
models:
  - name: romanian.par.gz
    url: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/romanian.par.gz
trained_on: '[MULTEXT-East](https://www.clarin.si/repository/xmlui/handle/11356/1043)'
name:
  swe: UD-Ordklasstaggning med TreeTagger för romänska
  eng: UD part-of-speech tagging with TreeTagger for Romanian
short_description:
  swe: Annotering av UD-ordklasser (universal dependencies) för romänska som översätts
    från TreeTagger-ordklasser
  eng: Part-of-speech annotation with UD (universal dependency) tags for Romanian
    translated from TreeTagger's part-of-speech tags
task: part-of-speech tagging
tagset: '[UD](https://universaldependencies.org/u/pos/)'
annotations:
  - <token>:treetagger.upos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.upos  # Part-of-speeches in UD
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: ron
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token upos="DET">O</token>
  <token upos="NOUN">limbă</token>
  <token upos="VERB">reprezintă</token>
  <token upos="DET">un</token>
  <token upos="NOUN">sistem</token>
  <token upos="ADJ">abstract</token>
  <token upos="PUNCT">,</token>
  <token upos="ADJ">complex</token>
  <token upos="PUNCT">,</token>
  <token upos="ADP">de</token>
  <token upos="NOUN">comunicare</token>
  <token upos="ADJ">verbală</token>
  <token upos="ADP">între</token>
  <token upos="NOUN">oameni</token>
  <token upos="PUNCT">.</token>
  ```
