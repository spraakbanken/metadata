name:
  swe: Ordklasstaggning med Stanford CoreNLP för engelska
  eng: Part-of-speech tagging with Stanford CoreNLP for English
short_description:
  swe: Annotering av Penn-ordklasser med Stanford CoreNLP för engelska
  eng: English part-of-speech annotation with Penn tags by Stanford CoreNLP
task: part-of-speech tagging
tagset: '[Penn Treebank tagset](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/Penn-Treebank-Tagset.pdf)'
annotations:
  - <token>:stanford.pos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:stanford.pos  # Part-of-speeches from Stanford Parser
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: eng
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token pos="NNP">Language</token>
  <token pos="VBZ">is</token>
  <token pos="DT">the</token>
  <token pos="JJ">human</token>
  <token pos="NN">ability</token>
  <token pos="TO">to</token>
  <token pos="VB">acquire</token>
  <token pos="CC">and</token>
  <token pos="VB">use</token>
  <token pos="JJ">complex</token>
  <token pos="NNS">systems</token>
  <token pos="IN">of</token>
  <token pos="NN">communication</token>
  <token pos=".">.</token>
  ```
