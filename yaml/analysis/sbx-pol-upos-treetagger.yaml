keywords:
  - treetagger
tools:
  - name: TreeTagger
    url: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/
    license: LicenseRef-Other
    license_other: TreeTagger License https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/Tagger-Licence
standard_reference: 'Helmut Schmid (1995): [Improvements in Part-of-Speech Tagging
  with an Application to German](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/tree-tagger2.pdf).
  Proceedings of the ACL SIGDAT-Workshop. Dublin, Ireland.'
other_references:
  - 'Helmut Schmid (1994): [Probabilistic Part-of-Speech Tagging Using Decision Trees](https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/tree-tagger1.pdf).
    Proceedings of International Conference on New Methods in Language Processing,
    Manchester, UK.'
created: 2014-09-16
updated: 2021-03-24
language_codes:
  - pol
models:
  - name: polish.par.gz
    url: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/polish.par.gz
trained_on: '[National Corpus of Polish (NKJP)](https://nkjp.pl/index.php?page=0&lang=1)'
name:
  swe: UD-Ordklasstaggning med TreeTagger för polska
  eng: UD part-of-speech tagging with TreeTagger for Polish
short_description:
  swe: Annotering av UD-ordklasser (universal dependencies) för polska som översätts
    från NKJP-ordklasser
  eng: Part-of-speech annotation with UD (universal dependency) tags for Polish translated
    from NKJP's part-of-speech tags
task: part-of-speech tagging
tagset: '[UD](https://universaldependencies.org/u/pos/)'
annotations:
  - <token>:treetagger.upos
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.upos  # Part-of-speeches in UD
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: pol
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token upos="NOUN">Język</token>
  <token upos="PUNCT">–</token>
  <token upos="PART">ukształtowany</token>
  <token upos="ADV">społecznie</token>
  <token upos="NOUN">system</token>
  <token upos="VERB">budowania</token>
  <token upos="NOUN">wypowiedzi</token>
  <token upos="PUNCT">,</token>
  <token upos="PART">używany</token>
  <token upos="ADP">w</token>
  <token upos="NOUN">procesie</token>
  <token upos="NOUN">komunikacji</token>
  <token upos="ADJ">interpersonalnej</token>
  <token upos="PUNCT">.</token>
  ```
