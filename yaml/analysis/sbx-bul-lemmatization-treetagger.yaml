name:
  swe: Annotering av grundformer med TreeTagger för bulgariska
  eng: Annotation of citation forms (base forms, lemmas) with TreeTagger for Bulgarian
short_description:
  swe: Annotering av grundformer (lemman) med TreeTagger för bulgariska
  eng: Lemmatization with TreeTagger for Bulgarian
task: lemmatization
annotations:
  - <token>:treetagger.baseform
type: analysis
analysis_unit: token
example: |-
  This analysis is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this analysis, add the following line under `export.annotations` in the Sparv [corpus configuration file](https://spraakbanken.gu.se/sparv/user-manual/quick-start/#creating-the-config-file):

  ```yaml
  - <token>:treetagger.baseform  # Baseforms from TreeTagger
  ```

  In order to use this annotation you need to add the following setting to your Sparv corpus configuration file:
  ```yaml
  metadata:
    language: bul
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

  Example output:
  ```xml
  <token baseform="Езѝкът">Езѝкът</token>
  <token baseform="е">е</token>
  <token baseform="система">система</token>
  <token baseform="от">от</token>
  <token baseform="знак">знаци</token>
  <token baseform="за">за</token>
  <token baseform="кодиране">кодиране</token>
  <token baseform="и">и</token>
  <token baseform="декодиране">декодиране</token>
  <token baseform="на">на</token>
  <token baseform="информация">информация</token>
  <token baseform=".">.</token>
  ```
