short_description:
  eng: Import of corpus data from ODT files
  swe: Import av korpusdata från ODT-filer
task: import
created: 2021-04-19
updated: 2021-04-19
description:
  swe: |-
    Detta hjälpverktyg gör det möjligt för Sparv att importera ODT-filer genom att extrahera deras text från
    XML-strukturen inuti ODT-filen.
  eng: This utility enables Sparv to process ODT files by extracting their text from
    the XML structure inside the ODT file.
type: utility
example: |
  This importer is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this importer, run Sparv with the argument 'odt_import:parse':

  ```sh
  sparv run odt_import:parse
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).
