example: |-
  This exporter is used with Sparv. Check out [Sparv's quick start guide](https://spraakbanken.gu.se/sparv/user-manual/quick-start/) to get started!

  To use this exporter, run Sparv with the argument 'xml_export:scrambled':

  ```sh
  sparv run xml_export:scrambled
  ```

  You need to tell Sparv which annotation to use for scrambling (typically `<sentence>` or `<paragraph>`). You can do
  this with the `xml_export.scramble_on` setting. E.g. if you want to have a sentence-scrambled export you will need to
  add the following setting to your Sparv corpus configuration file:
  ```yaml
  xml_export:
    scramble_on: <sentence>
  ```

  For more info on how to use Sparv, check out the [Sparv documentation](https://spraakbanken.gu.se/sparv).

