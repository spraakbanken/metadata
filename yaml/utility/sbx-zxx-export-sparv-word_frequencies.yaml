description:
  swe: |-
    Detta hjälpverktyg exporterar korpusstatistik som en ordfrekvenslista. Ordfrekvenslistan innehåller ordformer och de
    annotationer som har valts i konfigurationen, samt antalet förekomster av varje rad (ordform och dess annotationer)
    i korpusen. Ordfrekvenslistan kan bland annat användas för att analysera språkbruket i korpusen och för att
    identifiera vanliga ord och uttryck.
  eng: |-
    This utility exports corpus statistics as a word frequency list. The word frequency list contains the word forms and
    the annotations that have been selected in the configuration, as well as the number of occurrences of each row (word
    form and its annotations) in the corpus. The word frequency list can be used, among other things, to analyze
    language use in the corpus and to identify common words and expressions.
