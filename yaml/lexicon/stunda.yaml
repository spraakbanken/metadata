description:
  swe: Stunda är ett nätverk för Sveriges tekniska universitet med syfte att verka
    för effektiv fackspråklig kommunikation på svenska inom högre utbildning, i första
    hand genom att samla datatermlistor. Läs mer <a href="https://writing.chalmers.se/stunda/">här</a>.
  eng: Stunda is a network for Sweden's technical universities aimed at promoting
    efficient technical communication in Swedish within higher education, primarily
    by working with discipline-specific terminology. Read more <a href="https://writing.chalmers.se/stunda/">here</a>.
